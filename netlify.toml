[build]
  publish = "."
  command = ""

# Pas de build nécessaire - déploiement statique des fichiers HTML

# Redirects pour i18n et SPA
[[redirects]]
  from = "/*"
  to = "/fr/:splat"
  status = 301
  force = true
  conditions = {Language = ["fr"]}

[[redirects]]
  from = "/*"
  to = "/en/:splat"
  status = 301
  force = true
  conditions = {Language = ["en"]}

# Redirect academiea.com to www.academiea.com
[[redirects]]
  from = "https://academiea.com/*"
  to = "https://www.academiea.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy.html"

# Headers pour sécurité et performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
